apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: mongo-express
spec:
  ingressClassName: nginx-ingress
  rules:
  - host: 172.105.12.34
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mongo-express-service
              port:
                number: 8081
